plugins {
    id 'java'
}

apply from: "E:/Java/GradleScripts/build-base.gradle"
apply from: "../github-packages.gradle"

group = 'org.atcraftmc'
version = '1.0'

applyGlobalScript("Publish/ProjectOutput.gradle")
applyGlobalScript("Dependencies.gradle")
apply from: "../gbuild.gradle"

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation gbuildLib("me.gb2022.commons:commons-nbt")
    implementation gbuildLib("me.gb2022.commons:commons-math")
    implementation gbuildLib("me.gb2022.commons:commons-container")
    implementation gbuildLib("me.gb2022.commons:commons-general")
    implementation gbuildLib("me.gb2022.commons:commons-event")

    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'org.iq80.leveldb:leveldb:0.12'

    implementation project(":mcu-common")

    // https://mvnrepository.com/artifact/io.netty/netty-all

    implementation 'io.netty:netty-buffer:4.1.119.Final'
    implementation 'io.netty:netty-codec:4.1.119.Final'
    implementation 'io.netty:netty-handler:4.1.119.Final'
    implementation 'io.netty:netty-transport:4.1.119.Final'
    implementation 'io.netty:netty-codec-http:4.1.119.Final'
    implementation projectLib("bukkit-configuration")

    implementation gbuildLib('me.gb2022.simpnet:simpnet-base')
    implementation("org.yaml:snakeyaml:1.19")

    implementation "org.apache.logging.log4j:log4j-core:2.8.1"
    implementation platform("software.amazon.awssdk:bom:2.55.4")
    implementation "software.amazon.awssdk:s3"
    implementation "software.amazon.awssdk:s3-transfer-manager"



}

test {
    useJUnitPlatform()
}

jar{
    manifest{
        attributes "Main-Class":"org.atcgroup.mcupdater.server.Main";
    }
    archiveBaseName="mc-updater-server"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from {
        (configurations.runtimeClasspath).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}
