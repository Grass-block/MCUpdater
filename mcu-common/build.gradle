plugins {
    id 'java'
}

apply from: "E:/Java/GradleScripts/build-base.gradle"
apply from: "../github-packages.gradle"
apply from: "../gbuild.gradle"

group = 'org.atcraftmc'
version = '1.0-SNAPSHOT'

applyGlobalScript("Publish/ProjectOutput.gradle")
applyGlobalScript("Dependencies.gradle")

repositories {
    mavenCentral()
}

sourceCompatibility = '17'
targetCompatibility = '17'

dependencies {
    implementation gbuildLib("me.gb2022.commons:commons-nbt")
    implementation gbuildLib("me.gb2022.commons:commons-math")
    implementation gbuildLib("me.gb2022.commons:commons-container")
    implementation gbuildLib("me.gb2022.commons:commons-general")

    implementation 'com.google.code.gson:gson:2.12.1'

    compileOnly "org.apache.logging.log4j:log4j-core:2.8.1"
    compileOnly 'io.netty:netty-buffer:4.1.119.Final'
    compileOnly 'io.netty:netty-codec:4.1.119.Final'
    compileOnly 'io.netty:netty-handler:4.1.119.Final'
    compileOnly 'io.netty:netty-transport:4.1.119.Final'
    compileOnly 'io.netty:netty-codec-http:4.1.119.Final'

    implementation 'org.iq80.leveldb:leveldb:0.12'

    implementation gbuildLib('me.gb2022.simpnet:simpnet-base')


    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Netty, logging and CAS native libraries are supplied by consumers in production.
// The transferred tests need them on their own compile and runtime classpaths.
configurations {
    testImplementation.extendsFrom compileOnly
}

test {
    useJUnitPlatform()
}

// Opt-in only: generates and transfers 16 GiB; never runs as part of test/check/build.
tasks.register('rtpBenchmark', JavaExec) {
    group = 'benchmark'
    description = 'Transfer 16 GiB of random files over loopback RTP (explicit invocation only).'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'me.gb2022.mcupdater.BenchmarkClient'
    maxHeapSize = '1g'
    workingDir = projectDir
    args providers.gradleProperty('rtpBenchmarkMode').getOrElse('bftp')
}
